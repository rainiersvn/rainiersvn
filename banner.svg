<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="150" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Rainier van Niekerk</title>
  <desc id="desc">Cloudkid-brand banner: gradient name on a near-black violet backdrop with a faint grid, eyebrow reading Cloudkid, Cape Town, 8000, and a subtitle reading Cloud &amp; DevOps Specialist, Infrastructure &amp; Automation.</desc>
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(272 100% 85%)"/>
      <stop offset="40%" stop-color="hsl(268 90% 72%)"/>
      <stop offset="100%" stop-color="hsl(45 90% 65%)"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="hsl(250 12% 20% / 0.7)" stroke-width="1"/>
    </pattern>
    <radialGradient id="grid-fade" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="640" height="150" fill="url(#grid-fade)"/>
    </mask>
  </defs>

  <rect width="640" height="150" fill="hsl(252 20% 4%)"/>
  <rect width="640" height="150" fill="url(#grid)" mask="url(#grid-mask)"/>

  <text x="32" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" letter-spacing="3.3" fill="hsl(45 90% 60% / 0.8)">CLOUDKID · CAPE TOWN · 8000</text>

  <text x="30" y="90" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6" fill="url(#text-grad)">Hi, I'm Rainier van Niekerk ↗</text>

  <text x="32" y="120" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="hsl(250 10% 98% / 0.65)">Cloud &amp; DevOps Specialist · Infrastructure &amp; Automation</text>
</svg>
