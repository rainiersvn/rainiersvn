<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="90" viewBox="0 0 640 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hi there, I'm Rainier van Niekerk</title>
  <desc id="desc">Gradient text banner displaying the greeting Hi there, I'm Rainier van Niekerk with a waving hand emoji.</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif"
        font-size="36" font-weight="600" fill="url(#grad)">
    Hi there, I'm Rainier van Niekerk 👋
  </text>
